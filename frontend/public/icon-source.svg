<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <!-- Standalone copy of components/Logo.tsx with the CSS custom properties
       resolved to the default UAE-green scheme. Home-screen icons are rendered
       once at build time, outside the page, so they cannot inherit a theme. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00732f"/>
      <stop offset="100%" stop-color="#0b3d5c"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.6">
    <rect x="12" y="12" width="24" height="24" rx="2"/>
    <rect x="12" y="12" width="24" height="24" rx="2" transform="rotate(45 24 24)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 33 C 16 24, 32 26, 32 17"/>
  </g>
  <circle cx="16" cy="33" r="3" fill="#ffffff"/>
  <circle cx="32" cy="16" r="5" fill="#ffffff" fill-opacity="0.92"/>
</svg>
