name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint, types, tests, static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend and ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt

      # The catalogs are generated, so a hand-edit that never went through the
      # builder would drift silently. Rebuilding and diffing catches that.
      - name: Catalogs are reproducible from their builder
        run: |
          cd data && python -m v2.build
          cd .. && git diff --exit-code -- frontend/public/data \
            || (echo "::error::frontend/public/data is out of date — run 'cd data && python -m v2.build'" && exit 1)

      - name: Dataset is reproducible
        run: |
          python ml/generate_dataset.py --out /tmp/students.csv
          python - <<'PY'
          import pandas as pd
          committed = pd.read_csv("ml/data/students.csv")
          regenerated = pd.read_csv("/tmp/students.csv")
          assert committed.equals(regenerated), "ml/data/students.csv is out of date"
          print(f"dataset reproduced exactly: {len(committed)} rows")
          PY

      - name: Python/TypeScript inference parity fixtures
        run: python -m pytest ml/tests -q

      - name: Backend test suite
        run: cd backend && PYTHONPATH=. python -m pytest -q
